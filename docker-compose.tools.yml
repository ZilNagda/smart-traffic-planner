# Optional: run SonarQube locally for the lab (evaluation setup, not for production)
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
